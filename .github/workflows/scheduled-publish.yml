# Publishes articles whose date has arrived.
# Articles dated in the future stay hidden until the site is rebuilt on or after that date.
# This runs every morning (about 6:10 a.m. Pakistan time), rebuilds the site and pushes the result.
name: Scheduled publish

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Karachi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild site
        run: node build.js
      - name: Commit and push if anything changed
        run: |
          git config user.name "guidelark-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish today."
          else
            git commit -m "Scheduled publish $(date +%F)"
            git push
          fi
